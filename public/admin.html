<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console | AI WeatherWise</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container inner">
      <div class="brand"><span class="logo">🌤️</span> AI WeatherWise <span class="badge err">Admin</span></div>
      <nav class="nav-links" id="navLinks"></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Admin console</h1>
      <p class="muted">Role-guarded operations: system health, user management and request logs.</p>
    </section>

    <div class="grid grid-4" id="stats"></div>

    <section class="card mt">
      <div class="spread">
        <h2>Registered users</h2>
        <div class="row">
          <button class="btn sm ghost" id="refreshBtn">Refresh</button>
          <button class="btn sm ghost" id="logsBtn">View logs</button>
        </div>
      </div>
      <div class="msg" id="adminMsg"></div>
      <div style="overflow-x:auto">
        <table class="table" id="usersTable">
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card mt" id="logsCard" style="display:none">
      <div class="spread">
        <h2>Recent API requests</h2>
        <button class="btn sm ghost" id="closeLogs">Close</button>
      </div>
      <div style="overflow-x:auto"><table class="table" id="logsTable"></table></div>
    </section>
  </main>

  <footer>
    <div class="container">AI WeatherWise · Admin console · Developed by <strong>Hasna</strong> · 3rd Year BCA, Mohamed Sathak College of Arts and Science</div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
